<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <style>
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .hero-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      fill: #94a3b8;
      font-weight: 400;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }

    /* Dynamic SVG keyframe animations */
    @keyframes pulseGlow1 {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(30px, -20px); opacity: 0.65; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
    }
    @keyframes pulseGlow2 {
      0% { transform: scale(1.1) translate(0px, 0px); opacity: 0.4; }
      50% { transform: scale(0.9) translate(-25px, 25px); opacity: 0.7; }
      100% { transform: scale(1.1) translate(0px, 0px); opacity: 0.4; }
    }
    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }

    .orb-1 {
      animation: pulseGlow1 9s ease-in-out infinite;
      transform-origin: 250px 100px;
    }
    .orb-2 {
      animation: pulseGlow2 11s ease-in-out infinite;
      transform-origin: 950px 240px;
    }
    .card-float-1 {
      animation: floatCard1 5.5s ease-in-out infinite;
    }
    .card-float-2 {
      animation: floatCard2 6.5s ease-in-out infinite;
    }
    .animated-dash {
      stroke-dasharray: 6 6;
      animation: dashLine 4s linear infinite;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Background Animated Atmospheric Glows -->
  <g filter="url(#orbBlur)">
    <circle class="orb-1" cx="240" cy="90" r="130" fill="#3b82f6" opacity="0.35" />
    <circle class="orb-2" cx="960" cy="230" r="140" fill="#8b5cf6" opacity="0.35" />
    <circle cx="600" cy="330" r="100" fill="#ec4899" opacity="0.15" />
  </g>

  <!-- Decorative Network Grid & Dynamic Data Flow Lines -->
  <g opacity="0.25">
    <path d="M 50,70 Q 300,30 600,70 T 1150,70" fill="none" stroke="#60a5fa" stroke-width="1.5" class="animated-dash" />
    <path d="M 50,300 Q 400,340 700,290 T 1150,310" fill="none" stroke="#a78bfa" stroke-width="1.5" class="animated-dash" />
    <circle cx="200" cy="70" r="3" fill="#60a5fa" />
    <circle cx="600" cy="70" r="3" fill="#a78bfa" />
    <circle cx="1000" cy="70" r="3" fill="#f472b6" />
    <circle cx="350" cy="315" r="3" fill="#38bdf8" />
    <circle cx="850" cy="295" r="3" fill="#c084fc" />
  </g>

  <!-- Dynamic Side Badges / Floating Activity Cards (Arranged to never obstruct text) -->
  <!-- Left Side Dynamic Card -->
  <g class="card-float-1" transform="translate(48, 110)">
    <rect width="170" height="74" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="26" cy="28" r="10" fill="#0284c7" />
    <text x="26" y="32" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">OS</text>
    <text x="44" y="27" class="pill-text" font-size="12">Self-Hosted</text>
    <text x="44" y="42" font-family="sans-serif" font-size="10" fill="#94a3b8">Privacy First</text>
    <path d="M 16,56 L 154,56" stroke="#334155" stroke-width="1" />
    <circle cx="26" cy="64" r="3" fill="#10b981" />
    <text x="35" y="67" font-family="sans-serif" font-size="9" fill="#10b981">100% Data Ownership</text>
  </g>

  <!-- Right Side Dynamic Card -->
  <g class="card-float-2" transform="translate(982, 110)">
    <rect width="170" height="74" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="26" cy="28" r="10" fill="#7c3aed" />
    <text x="26" y="32" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">AI</text>
    <text x="44" y="27" class="pill-text" font-size="12">Smart Workspaces</text>
    <text x="44" y="42" font-family="sans-serif" font-size="10" fill="#94a3b8">Chat • Docs • Tasks</text>
    <path d="M 16,56 L 154,56" stroke="#334155" stroke-width="1" />
    <circle cx="26" cy="64" r="3" fill="#38bdf8" />
    <text x="35" y="67" font-family="sans-serif" font-size="9" fill="#38bdf8">Real-time Collaboration</text>
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Category Pills) -->
  <!-- Top Category Chip -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="-118" cy="0" r="5" fill="#3b82f6">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-106" y="4" font-family="sans-serif" font-size="11" fill="#93c5fd" font-weight="700" letter-spacing="1">CURATED AWESOME DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="126" text-anchor="middle" class="hero-title" fill="url(#primaryTextGrad)" filter="url(#subtleGlow)">
    Team Collaboration &amp; Workspace
  </text>

  <!-- Subtitle -->
  <text x="600" y="165" text-anchor="middle" class="hero-subtitle">
    The Definitive Guide to Modern Digital Workspaces, SaaS Platforms &amp; Open-Source Hubs
  </text>

  <!-- Feature Pills -->
  <g transform="translate(260, 204)">
    <!-- Pill 1: Team Chat -->
    <g transform="translate(0, 0)">
      <rect width="120" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6" />
      <text x="60" y="22" text-anchor="middle" class="pill-text">💬 Team Chat</text>
    </g>
    <!-- Pill 2: Docs & Wikis -->
    <g transform="translate(136, 0)">
      <rect width="134" height="34" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6" />
      <text x="67" y="22" text-anchor="middle" class="pill-text">📝 Docs &amp; Wikis</text>
    </g>
    <!-- Pill 3: Task Boards -->
    <g transform="translate(286, 0)">
      <rect width="134" height="34" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1" stroke-opacity="0.6" />
      <text x="67" y="22" text-anchor="middle" class="pill-text">📋 Task Boards</text>
    </g>
    <!-- Pill 4: Whiteboards -->
    <g transform="translate(436, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
      <text x="65" y="22" text-anchor="middle" class="pill-text">🎨 Whiteboards</text>
    </g>
    <!-- Pill 5: Video & Voice -->
    <g transform="translate(582, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6" />
      <text x="65" y="22" text-anchor="middle" class="pill-text">🎥 Video Calls</text>
    </g>
  </g>

  <!-- Bottom Metric / Tagline Ribbon -->
  <g transform="translate(600, 290)">
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b" letter-spacing="0.3">
      ⚡ Unifying Chat • Documents • Issue Tracking • Visual Canvases • Local-First &amp; Cloud Architectures
    </text>
  </g>
</svg>
